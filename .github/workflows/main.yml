name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production

env:
  NODE_VERSION: '22'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # -----------------------------------------------------------------------
      # This project's mobile app (and its eas.json) lives in mobile/, not
      # the repo root — install and build must run from that folder.
      # -----------------------------------------------------------------------
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      # -----------------------------------------------------------------------
      # Diagnostic: print which repo/branch/event this run is actually using.
      # Helps confirm the secret was added to the SAME repo that is running.
      # -----------------------------------------------------------------------
      - name: Print run context (debug)
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

      # -----------------------------------------------------------------------
      # Verify the EXPO_TOKEN secret is actually configured BEFORE trying to
      # use it. We only check whether the value is empty — we never print
      # the value itself.
      # -----------------------------------------------------------------------
      - name: Verify EXPO_TOKEN secret is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "EXPO_TOKEN secret is present (value not shown)."

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # -----------------------------------------------------------------------
      # The actual APK build. Runs from mobile/ where eas.json lives.
      # --non-interactive prevents eas-cli from prompting in CI.
      # -----------------------------------------------------------------------
      - name: Build Android APK with EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.build_profile || 'preview' }}" \
            --non-interactive \
            --wait
